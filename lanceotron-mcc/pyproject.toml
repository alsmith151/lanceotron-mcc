[build-system]
requires = ["setuptools >= 61.0", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "lanceotron_mcc"
authors = [{ name = "Alastair Smith", email = "alastair.smith@ndcls.ox.ac.uk"} ]
description = "Quick re-write of LanceOTron2 for MCC"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GNU GENERAL PUBLIC LICENSE Version 3" }
version = "0.1.0"
dynamic = ["dependencies"]
scripts = { "lanceotron-mcc" =  "lanceotron_mcc.call_peaks:main" }

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
packages = ["lanceotron_mcc", "lanceotron_mcc.api"]
include-package-data = true

# [tool.setuptools_scm]
# local_scheme = "no-local-version"
# write_to = "lanceotron_mcc/_version.py"

[project.urls]
Homepage = "https://github.com/alsmith151/lanceotron-mcc"