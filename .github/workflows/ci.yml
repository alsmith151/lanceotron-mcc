name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Lockfile matches pyproject
        run: uv lock --check
      - run: uv run --locked --extra dev ruff check .
      - run: uv run --locked --extra dev ruff format --check .
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  rust:
    # Kernel unit tests; without the `python` feature nothing links Python.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release

  test:
    name: test (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - uses: Swatinem/rust-cache@v2
      - name: Full suite (builds the native extension; dev extra includes plot)
        run: uv run --locked --extra dev pytest -q

  core-install:
    # The CLI must work without optional extras such as matplotlib.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --no-dev
      - run: uv run --no-sync mcc-peaks --version
      - run: uv run --no-sync mcc-peaks call-bigwig-peaks --help > /dev/null
      - run: uv run --no-sync mcc-peaks footprint --help > /dev/null

  wheels:
    # One abi3 wheel per platform covers every supported Python.
    name: wheel (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-15-intel, target: x86_64 }
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/setup-python@v6
        if: matrix.target == 'x86_64' && runner.os == 'Linux' || matrix.target == 'aarch64' && runner.os == 'macOS'
        with:
          python-version: "3.12"
      - name: Wheel installs and runs in a clean env
        if: matrix.target == 'x86_64' && runner.os == 'Linux' || matrix.target == 'aarch64' && runner.os == 'macOS'
        run: |
          python3 -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/mcc-peaks --version
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - run: pipx run twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/

  docker:
    # Build only (no push) so Dockerfile breakage shows up before a release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mcc-peaks:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          docker run --rm mcc-peaks:ci mcc-peaks --version
          docker run --rm mcc-peaks:ci python -c "import matplotlib, mcc_peaks._core"
          docker run --rm mcc-peaks:ci mcc-peaks footprint --help > /dev/null
