[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcc-peaks"
version = "0.1.0"
authors = [{ name = "Alastair Smith", email = "alastair.smith@ndcls.ox.ac.uk" }]
description = "Distance-aware, replicate-supported peak calling for MCC data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GNU GENERAL PUBLIC LICENSE Version 3" }
dynamic = ["dependencies"]

[project.scripts]
mcc-peaks = "mcc_peaks.call_peaks:main"

[project.optional-dependencies]
legacy = ["torch>=2.6,<3", "pyranges"]
plot = ["matplotlib>=3.8,<4"]
dev = ["pytest>=8", "ruff>=0.9", "torch>=2.6,<3", "pyranges", "matplotlib>=3.8,<4"]

[project.urls]
Homepage = "https://github.com/alsmith151/lanceotron-mcc"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
packages = ["mcc_peaks", "mcc_peaks.api"]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["test_peak_calling.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
